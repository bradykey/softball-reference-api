# Hibernate Properties

# Hibernate validates entities match the live schema on boot; never mutates it.
# Schema changes are driven by Flyway migrations in src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true

# Flyway: on the existing Heroku DB, baseline-on-migrate=true + baseline-version=1
# marks V1 as already-applied (no re-run). On a fresh local DB, V1 runs from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial schema captured from live Heroku DB
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=always
spring.sql.init.platform=postgres

# This gets set by Heroku. You can override it in application-local.properties if you want to run locally. 
spring.datasource.url=

# IDK what this does.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Make sure the message is passed through in the HttpResponse message prop
server.error.include-message=always

# Admin auth (set as Heroku config vars). PASSWORD_HASH is a bcrypt hash of the plaintext password.
# JWT_SECRET must be at least 32 bytes for HS256.
# NOTE: To run locally, the ADMIN_USERNAME, ADMIN_PASSWORD_HASH, and JWT_SECRET env vars need to be set in the session
admin.username=${ADMIN_USERNAME:}
admin.password-hash=${ADMIN_PASSWORD_HASH:}
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Swagger UI / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs