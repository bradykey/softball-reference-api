# Hibernate Properties

#spring.datasource.driver-class-name=postgres

# This turns off code-first implementation and defaults to db-first.
spring.jpa.hibernate.ddl-auto=none
# I _think_ we used code-first to create the tables initially, then turned it off? Or at least just ran it one time...
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.platform=postgres

# This gets set by Heroku. You can override it in application-local.properties if you want to run locally. 
spring.datasource.url=

# IDK what this does.
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Make sure the message is passed through in the HttpResponse message prop
server.error.include-message=always

# Admin auth (set as Heroku config vars). PASSWORD_HASH is a bcrypt hash of the plaintext password.
# JWT_SECRET must be at least 32 bytes for HS256.
# NOTE: To run locally, the ADMIN_USERNAME, ADMIN_PASSWORD_HASH, and JWT_SECRET env vars need to be set in the session
admin.username=${ADMIN_USERNAME:}
admin.password-hash=${ADMIN_PASSWORD_HASH:}
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Swagger UI / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs